services:

  postgres:
    image: postgres:16-alpine
    container_name: ibn-zta-postgres
    environment:
      POSTGRES_DB: ibn_zta
      POSTGRES_USER: ibn_zta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ibn_zta"]
      interval: 5s
      retries: 5
    networks:
      oai_net:
        ipv4_address: 192.168.70.140

  redis:
    image: redis:7-alpine
    container_name: ibn-zta-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
    networks:
      oai_net:
        ipv4_address: 192.168.70.141

networks:
  oai_net:
    external: true
    name: oai-cn5g-public-net

volumes:
  pgdata:
